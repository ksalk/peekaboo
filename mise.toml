[tools]
dotnet = "10.0.101"
node = "26.12.1"

[tasks."build:api"]
description = "Build the backend and test projects"
run = "dotnet build backend/Peekaboo.slnx --nologo"

[tasks."test:api"]
description = "Run backend tests"
run = "dotnet test backend/Peekaboo.slnx --nologo"

[tasks."setup:web"]
description = "Install frontend dependencies from the lockfile"
run = "npm --prefix frontend ci"

[tasks."dev:web"]
description = "Run the frontend dev server"
run = "npm --prefix frontend run dev"

[tasks."build:web"]
description = "Build the frontend"
depends = ["setup:web"]
run = "npm --prefix frontend run build"

[tasks."check:web"]
description = "Type-check the frontend"
depends = ["setup:web"]
run = "npm --prefix frontend run check"

[tasks."lint:web"]
description = "Lint the frontend"
depends = ["setup:web"]
run = "npm --prefix frontend run lint"

[tasks."test:web"]
description = "Run frontend unit tests"
depends = ["setup:web"]
run = "npm --prefix frontend run test:unit"

[tasks."setup:e2e"]
description = "Install end-to-end test dependencies"
run = "npm --prefix e2e ci"

[tasks."check:e2e"]
description = "Type-check the end-to-end tests"
depends = ["setup:e2e"]
run = "npm --prefix e2e run check"

[tasks.e2e]
description = "Run Playwright end-to-end tests with local RTSP feeds"
depends = ["setup:web", "setup:e2e"]
run = "./scripts/e2e.sh"

[tasks.dev]
description = "Run backend and frontend in development mode"
run = "./scripts/dev.sh"

[tasks.build]
description = "Build backend and frontend"
depends = ["build:api", "build:web"]

[tasks.lint]
description = "Lint and type-check everything"
depends = ["lint:web", "check:web", "test:web", "check:e2e"]

[tasks.test]
description = "Run backend and end-to-end tests"
depends = ["test:api"]
run = "mise run e2e"

[tasks."docker:build"]
description = "Build the private Hikvision SDK container image for PEEKABOO_REGISTRY"
run = '''
: "${PEEKABOO_REGISTRY:?Set PEEKABOO_REGISTRY in mise.local.toml or the environment}"
if [ ! -f vendor/hikvision/libhcnetsdk.so ]; then
  echo "vendor/hikvision is missing the Hikvision SDK library." >&2
  echo "Copy EN-HCNetSDKV*_linux64/lib/. into vendor/hikvision and retry." >&2
  exit 1
fi
version="$(tr -d '[:space:]' < VERSION)"
tag="${PEEKABOO_TAG:-$version}"
image="${PEEKABOO_REGISTRY%/}/peekaboo:${tag}"
docker build \
  --target runtime-sdk \
  --build-arg APP_VERSION="$version" \
  --build-arg APP_REVISION="$(git rev-parse --short HEAD)" \
  --tag "$image" .
echo "Built $image (runtime-sdk)"
'''

[tasks."docker:publish"]
description = "Push the private Hikvision SDK image to PEEKABOO_REGISTRY"
depends = ["docker:build"]
run = '''
: "${PEEKABOO_REGISTRY:?Set PEEKABOO_REGISTRY in mise.local.toml or the environment}"
version="$(tr -d '[:space:]' < VERSION)"
tag="${PEEKABOO_TAG:-$version}"
image="${PEEKABOO_REGISTRY%/}/peekaboo:${tag}"
if ! docker image inspect "$image" | grep -q '"PEEKABOO_HIK_SDK_PATH='; then
  echo "Refusing to publish $image: it has no PEEKABOO_HIK_SDK_PATH, so live" >&2
  echo "streams would fail with \"The Hikvision SDK is not configured\". Rebuild" >&2
  echo "with: mise run docker:build" >&2
  exit 1
fi
docker push "$image"
echo "Published $image"
'''

[tasks.release]
description = "Create the release tag for the version in VERSION"
run = "./scripts/release.sh"

